name: ystack CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate-public-starter:
    name: Check opt-in starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill metadata and installer safety
        run: bash scripts/validate-vnext.sh
      - name: Check historical JS parses (not a runtime endorsement)
        run: |
          node --check scripts/full-run.js
          node --check scripts/parallel-dispatch.js

  check-target-branch:
    name: Enforce PR target branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: PRs to main must come from dev
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "ERROR: PRs to main must come from the dev branch"
            exit 1
          fi
          echo 'Branch target valid'

